# ── Alpha variants ──
# 主に hyprlock で使用 (ブラー壁紙上の半透明UI要素)。
# 命名規則: $<token>_a<NN>  (NN = 不透明度パーセント)
# hex alpha 対応表: 0.50→80, 0.75→bf, 0.80→cc, 0.85→d9, 0.90→e6, 0.95→f2
$primary_a95 = rgba(dab9f9f2)
$primary_fixed_a80 = rgba(f0dbffcc)
$primary_container_a85 = rgba(553b71d9)
$primary_container_a90 = rgba(553b71e6)
$tertiary_a95 = rgba(f3b7bef2)
$surface_a75 = rgba(151218bf)
$on_surface_a50 = rgba(e8e0e880)

# ── 状態色 (壁紙非追従の固定値) ──
$state_success = rgb(a6e3a1)
$state_critical = rgb(f38ba8)
$state_success_a90 = rgba(a6e3a1e6)
$state_critical_a90 = rgba(f38ba8e6)
