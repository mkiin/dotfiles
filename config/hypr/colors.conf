# Hyprland 色定義 (matugen 生成)
# 壁紙から Material Design 3 パレットを抽出し、全トークンを Hyprland 変数として露出する。
# hyprland.conf 側で `source = ~/.config/hypr/colors.conf` して $primary / $surface 等を参照する。
# Hyprland の色記法は `rgb(RRGGBB)` (# なし) なので hex_stripped を使う。


$background = rgb(151218)

$error = rgb(ffb4ab)

$error_container = rgb(93000a)

