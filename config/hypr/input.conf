input {
    kb_layout = us                 # キーボードレイアウト
    follow_mouse = 1               # マウス移動でフォーカス追従 (1=移動時, 2=常時, 0=クリックのみ)
    sensitivity = 0                # マウス感度 (-1.0〜1.0, 0=変更なし)
    scroll_factor = 2              # スクロール量の倍率 (デフォルト=1)

    touchpad {
        natural_scroll = false     # ナチュラルスクロール (Mac風の逆方向スクロール)
    }
}

# タッチパッドジェスチャー: 3本指の水平スワイプでワークスペース切替
gesture = 3, horizontal, workspace
