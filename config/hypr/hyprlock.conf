# Hyprlock 設定
# BlackNode / botti-the-lock 参考
# DESKTOP_SPEC: 時計 / 日付 / アバター / 迎える言葉 / パスワード入力

# ==============================================
# 背景: 現在の壁紙を blur
# ==============================================
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

# ==============================================
# 基本設定
# ==============================================
general {
    hide_cursor = false
    ignore_empty_input = true
}

# ==============================================
# アニメーション
# fadeOut をデフォルト 0.8s → 0.2s に短縮（unlock 時の残像感対策）
# ==============================================
animations {
    enabled = true
    animation = fadeOut, 1, 1, linear
}

# ==============================================
# 時計 (HH:MM)
# ==============================================
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(205, 214, 244, 0.95)
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 240
    halign = center
    valign = center
}

# ==============================================
# 日付 (曜日, 月日)
# ==============================================
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %-d")"
    color = rgba(205, 214, 244, 0.80)
    font_size = 28
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 110
    halign = center
    valign = center
}

# ==============================================
# アバター画像（~/.face.icon があれば表示）
# ==============================================
image {
    monitor =
    path = ~/.face.icon
    border_color = rgba(137, 180, 250, 0.9)
    border_size = 3
    size = 140
    rounding = -1
    rotate = 0
    reload_time = -1
    position = 0, -20
    halign = center
    valign = center
}

# ==============================================
# 迎える言葉（時間帯別）
# ==============================================
label {
    monitor =
    text = cmd[update:3600000] echo "$(h=$(date +%H); if [ $h -lt 6 ]; then echo 'Good night'; elif [ $h -lt 12 ]; then echo 'Good morning'; elif [ $h -lt 18 ]; then echo 'Good afternoon'; else echo 'Good evening'; fi), $USER"
    color = rgba(203, 166, 247, 0.95)
    font_size = 22
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -150
    halign = center
    valign = center
}

# ==============================================
# パスワード入力フィールド
# ==============================================
input-field {
    monitor =
    size = 320, 60
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(137, 180, 250, 0.85)
    inner_color = rgba(30, 30, 46, 0.75)
    font_color = rgba(205, 214, 244, 1.0)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i><span foreground="##cdd6f4aa">Enter password...</span></i>
    hide_input = false
    check_color = rgba(166, 227, 161, 0.9)
    fail_color = rgba(243, 139, 168, 0.9)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -230
    halign = center
    valign = center
}

# ==============================================
# "Type to unlock" ヒント
# ==============================================
label {
    monitor =
    text = Type to unlock
    color = rgba(205, 214, 244, 0.5)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -310
    halign = center
    valign = center
}
