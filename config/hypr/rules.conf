# 全ウインドウの最大化リクエストを抑制 (タイリングWMでは不要なため)
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# XWaylandのドラッグ問題を修正
# クラスもタイトルも空のXWaylandフローティングウインドウからフォーカスを外す
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# hyprland-run (コマンドランナー) を画面下部にフロート表示
windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}

# ── Layer rules ──
# wlogout (namespace: logout_dialog) の背景に blur をかけ、その下を少し暗くする。
# wlogout の style.css は window を完全透過 (rgba 0,0,0,0) にしているので、
# 裏の壁紙が直接透けるのを blur + dim でロック系らしく落ち着かせる。
# ignore_alpha: blur 対象から完全透明ピクセル (=壁紙そのもの) を除外しないため 0 のまま。
layerrule = blur on, match:namespace logout_dialog
layerrule = dim_around on, match:namespace logout_dialog
