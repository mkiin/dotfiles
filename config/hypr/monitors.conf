# モニター設定
# 書式: monitor = 名前, 解像度@リフレッシュレート, 位置(x,y), スケール
# 物理配置: [DP-3] [DP-2] [DP-1] [HDMI-A-1]
#            1080p  1440p  1080p   1080p

monitor = DP-3,     1920x1080@60,   0x0,       1    # 左1: BenQ GW2480 (最大60Hz)
monitor = DP-2,     2560x1440@180, 1920x0,    1    # 左2: BenQ EX271Q
monitor = DP-1,     1920x1080@100, 4480x0,    1    # 左3: BenQ GW2491
monitor = HDMI-A-1, 1920x1080@144, 6400x0,    1    # 左4: BenQ EX2510

# ワークスペースをモニターに固定 (左から1,2,3,4)
workspace = 1, monitor:DP-3, default:true
workspace = 2, monitor:DP-2, default:true
workspace = 3, monitor:DP-1, default:true
workspace = 4, monitor:HDMI-A-1, default:true
