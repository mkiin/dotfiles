# 起動時に1回だけ実行するコマンド (exec-once)
# リロード時には再実行されない
#
# 前提: Hyprland は uwsm 経由で起動されている。
#   systemd user manager の子プロセスとして Hyprland が走るため、
#   home.nix の systemd.user.settings.Manager.DefaultEnvironment で宣言した
#   PATH (Nix 系含む) が Hyprland 自身と exec 子プロセス全てに継承される。
#
# ルール: 常駐するデーモン系は `uwsm app --` でラップする。
#   これにより各デーモンが systemd scope に取り込まれ、graphical-session.target
#   と寿命が揃う。単発コマンド (keybind の exec 等) は uwsm app 不要。

exec-once = uwsm app -- fcitx5 -d --replace    # 日本語入力 (fcitx5)
exec-once = uwsm app -- waybar                 # ステータスバー
exec-once = uwsm app -- swaync                 # 通知デーモン + コントロールセンター
exec-once = uwsm app -- hypridle               # アイドル管理
exec-once = uwsm app -- $HOME/.config/awww/scripts/wallpaper-init.sh  # 壁紙デーモン + 初期壁紙

# 環境変数 (Hyprland session 固有)
env = XCURSOR_SIZE,24              # カーソルサイズ
env = HYPRCURSOR_SIZE,24           # Hyprcursor用カーソルサイズ
env = XMODIFIERS,@im=fcitx         # X11アプリ向けIME設定
