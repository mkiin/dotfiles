# 起動時に1回だけ実行するコマンド (exec-once)
# リロード時には再実行されない
exec-once = fcitx5 -d --replace    # 日本語入力 (fcitx5) をデーモンとして起動
exec-once = waybar                 # ステータスバー
exec-once = swaync                 # 通知デーモン + コントロールセンター
exec-once = hypridle               # アイドル管理
exec-once = $HOME/.config/awww/scripts/wallpaper-init.sh  # 壁紙デーモン + 初期壁紙

# 環境変数
env = XCURSOR_SIZE,24              # カーソルサイズ
env = HYPRCURSOR_SIZE,24           # Hyprcursor用カーソルサイズ
env = XMODIFIERS,@im=fcitx         # X11アプリ向けIME設定
