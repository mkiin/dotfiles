name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-nix

      - name: Check flake
        run: nix flake check --show-trace

      - name: Check secret selection
        run: |
          nix eval --json .#nixosConfigurations --apply '
            hosts:
            let
              yukino = hosts.oregairu-yukino;
              commonOnly = yukino.extendModules {
                modules = [ ({ lib, ... }: { modules.secrets.desktop.enable = lib.mkForce false; }) ];
              };
              secrets = host: host.config.age.secrets;
              hasDesktopSecrets = host: (secrets host) ? "user-password" && (secrets host) ? "rclone-r2.conf";
            in
            assert hasDesktopSecrets yukino;
            assert hasDesktopSecrets hosts.oregairu-yui;
            assert (secrets commonOnly) ? "user-password";
            assert !((secrets commonOnly) ? "rclone-r2.conf");
            true
          '

      - name: Check installer
        run: nix flake check ./installer --show-trace

  build:
    name: Build NixOS
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-nix

      - uses: cachix/cachix-action@v17
        with:
          name: mkiin-dotfiles
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build NixOS (oregairu-yukino)
        run: nix run .#build -- oregairu-yukino

      - name: Build NixOS (oregairu-yui)
        run: nix run .#build -- oregairu-yui
