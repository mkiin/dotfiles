name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-nix

      - name: Check flake
        run: nix flake check --show-trace

  build:
    name: Build NixOS
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-nix

      - uses: cachix/cachix-action@v17
        with:
          name: mkiin-dotfiles
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build NixOS (oregairu-yukino)
        run: nix run .#build -- oregairu-yukino

      - name: Build NixOS (oregairu-yui)
        run: nix run .#build -- oregairu-yui

  reinstall:
    name: Check reinstall tooling
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix

      - name: Test trusted-host enrollment and rollback
        run: |
          nix --option access-tokens '' develop --impure \
            --expr 'import ./scripts/reinstall-tools.nix' \
            -c bash -euc '
              bash tests/check-installer-password.sh
              python3 -B -m unittest discover -s tests -p "test_*.py" -v
            '

      - name: Build minimal installer
        run: >-
          nix --option access-tokens '' build
          ./installer#nixosConfigurations.oregairu-yui.config.system.build.toplevel
          --no-link
