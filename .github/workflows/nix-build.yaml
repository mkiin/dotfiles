name: "CI: Nix build"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            nix:
              - 'flake.nix'
              - 'flake.lock'
              - 'hosts/**'
              - 'lib/**'
              - 'nixos/**'
              - 'home-manager/**'
              - 'packages/**'
              - '.github/workflows/nix-build.yaml'
              - '.github/actions/setup-nix/**'

  build:
    name: build (${{ matrix.name }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nixos
            attr: ".#nixosConfigurations.nixos.config.system.build.toplevel"
          - name: wsl-home
            attr: '.#homeConfigurations."mkiin@wsl".activationPackage'
    steps:
      - name: Skip if no Nix changes
        if: needs.changes.outputs.nix != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No Nix-related changes detected, skipping build"

      - name: Checkout repository
        if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Setup Nix
        if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/setup-nix

      - name: Setup Cachix
        if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
        uses: cachix/cachix-action@v17
        with:
          name: mkiin-dotfiles
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build ${{ matrix.name }} configuration
        if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          nix build '${{ matrix.attr }}' \
            --print-build-logs \
            --show-trace
