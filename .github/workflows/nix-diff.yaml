name: "Nix Diff"

on:
  pull_request:
    paths:
      - "flake.lock"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: nix-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: mkiin-dotfiles
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Compare NixOS systems
        uses: natsukium/nix-diff-action@v1.1.1
        with:
          attributes: |
            - displayName: oregairu-yukino
              attribute: nixosConfigurations.oregairu-yukino.config.system.build.toplevel
          build: false
          comment-strategy: update
          skip-no-change: false
