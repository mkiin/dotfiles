# グローバル変数 (各confファイルから $variable で参照可能)
$terminal = ghostty
$fileManager = dolphin
$browser = zen-browser
$menu = walker
$mainMod = SUPER              # メインの修飾キー (Windowsキー)

# ── source 読み込み順 ──
# 1. env (最初: 他ファイル評価前に環境変数を確定)
# 2. colors (次: appearance で $primary 等を参照するため)
# 3. 機能別 (monitor/input/cursor/appearance/keybind/rule)
# 4. autostart (最後: デーモン起動はここまでの設定が効いた状態で)
source = ~/.config/hypr/env.conf
source = ~/.config/hypr/colors.conf

source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/cursor.conf
source = ~/.config/hypr/appearance.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/rules.conf

source = ~/.config/hypr/autostart.conf
