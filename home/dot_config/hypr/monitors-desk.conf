# desk-mode のモニター定義
# 物理配置: [DP-3] [DP-2] [DP-1]
#            1080p  1440p  1080p

monitor = DP-3,     1920x1080@60,   0x0,       1    # 左1: BenQ GW2480 (最大60Hz)
monitor = DP-2,     2560x1440@180, 1920x0,    1    # 左2: BenQ EX271Q
monitor = DP-1,     1920x1080@100, 4480x0,    1    # 左3: BenQ GW2491
monitor = HDMI-A-1, disable                         # ベッド用は無効

# ワークスペースをモニターに固定。desk-mode は 3 枚運用なので ws 1-3 だけ常在。
# Super+I/O (e-1/e+1) が空でも 1-3 を巡回できる。
# ws 4+ はキーバインド (Super+4..0) で動的に作られた時のみ存在。
workspace = 1, monitor:DP-3, default:true, persistent:true
workspace = 2, monitor:DP-2, default:true, persistent:true
workspace = 3, monitor:DP-1, default:true, persistent:true
