general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = $primary $tertiary 45deg
    col.inactive_border = $outline_variant
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 16
    rounding_power = 2
    shadow {
        enabled = false
    }
    blur {
        enabled = true
        size = 1
        passes = 1
        vibrancy = 0.2
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1
    bezier = bounce,         0.05, 0.9,  0.1,  1.05

    animation = global,        1, 10,   default
    animation = border,        1, 5.39, easeOutQuint
    animation = windows,       1, 4.5,  bounce
    animation = windowsIn,     1, 4.5,  bounce, popin 80%
    animation = windowsOut,    1, 1.5,  linear, popin 80%
    animation = fadeIn,        1, 1.7,  almostLinear
    animation = fadeOut,       1, 1.5,  almostLinear
    animation = fade,          1, 3,    quick
    animation = layers,        1, 3.8,  easeOutQuint
    animation = layersIn,      1, 4,    easeOutQuint, fade
    animation = layersOut,     1, 1.5,  linear,       fade
    animation = fadeLayersIn,  1, 1.8,  almostLinear
    animation = fadeLayersOut, 1, 1.4,  almostLinear
    animation = workspaces,    1, 3,    bounce, slidefadevert
    animation = workspacesIn,  1, 3,    bounce, slidefadevert
    animation = workspacesOut, 1, 3,    bounce, slidefadevert
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}
