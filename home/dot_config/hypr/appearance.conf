general {
    gaps_in = 3
    gaps_out = 8
    border_size = 0
    col.active_border = $primary $tertiary 45deg
    col.inactive_border = $outline_variant
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

group {
    col.border_active = $primary $tertiary 45deg
    col.border_inactive = $outline_variant
    col.border_locked_active = $primary $tertiary 45deg
    col.border_locked_inactive = $outline_variant
}

decoration {
    rounding = 10

    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba(00000080)
        color_inactive = rgba(00000033)
    }

    blur {
        enabled = yes
        size = 6
        passes = 3
        new_optimizations = on
        ignore_opacity = on
        xray = false
    }
}

animations {
    enabled = yes
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, once
    animation = fade, 1, 2, default
    animation = workspaces, 1, 5, wind
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}
