# モニター設定 entry point。
# 現在モード (desk / bed) の定義を monitors-active.conf 経由で読み込む。
# monitors-active.conf は runtime 状態ファイル (bed-mode.sh / desk-mode.sh が書き換える)。
#
# `hyprctl reload` で再評価される際もこの間接経由で現在モードが維持される。
# (壁紙パイプラインで全 reload しても bed-mode が吹き飛ばないための仕組み)

source = ~/.config/hypr/monitors-active.conf
