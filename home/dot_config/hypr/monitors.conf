# モニター設定
# 書式: monitor = 名前, 解像度@リフレッシュレート, 位置(x,y), スケール
# 物理配置: [DP-3] [DP-2] [DP-1] | (HDMI-A-1 はベッド用・デフォルト無効)
#            1080p  1440p  1080p |  1080p
#
# デフォルトは desk-mode (3 枚)。bed-mode は scripts/bed-mode.sh で動的に切替。
# wallpaper.sh の hyprctl reload で 4 枚に戻らないよう、HDMI-A-1 は disable を既定に。

monitor = DP-3,     1920x1080@60,   0x0,       1    # 左1: BenQ GW2480 (最大60Hz)
monitor = DP-2,     2560x1440@180, 1920x0,    1    # 左2: BenQ EX271Q
monitor = DP-1,     1920x1080@100, 4480x0,    1    # 左3: BenQ GW2491
monitor = HDMI-A-1, disable                         # ベッド用 BenQ EX2510 (bed-mode で有効化)

# ワークスペースをモニターに固定 (1-3 はデスク、4 はベッド用)
# persistent:true で空でも常在させる → Super+I/O (e-1/e+1) が確実に巡回できる。
# ws 4 は HDMI-A-1 が起動時 disable なので persistent にせず、bed-mode で動的付与。
workspace = 1, monitor:DP-3, default:true, persistent:true
workspace = 2, monitor:DP-2, default:true, persistent:true
workspace = 3, monitor:DP-1, default:true, persistent:true
workspace = 4, monitor:HDMI-A-1, default:true
