windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}

windowrule {
    name = float-guvcview
    match:class = ^guvcview$
    float = yes
}

layerrule = blur on, match:namespace logout_dialog
layerrule = dim_around on, match:namespace logout_dialog

# rofi の blur / dim_around 削除: 矩形 layer 全体に効いて丸い mainbox の角がぼやける副作用回避
