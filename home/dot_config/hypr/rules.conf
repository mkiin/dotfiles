windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}

windowrule {
    name = float-guvcview
    match:class = ^guvcview$
    float = yes
}

windowrule {
    name = float-pwvucontrol
    match:class = ^com\.saivert\.pwvucontrol$
    float = yes
    size = 700 800
    center = 1
}

# Wine の explorer.exe /desktop が NIKKE セッション中に常に上層に出してくる
# 160x20 の小窓を special workspace に黙って飛ばす。
# NIKKE セッション終了時には nikke-launch.sh の trap が wineserver -k で一掃する。
windowrule {
    name = hide-wine-explorer-desktop
    match:class = ^steam_proton$
    match:title = ^$
    match:xwayland = true
    workspace = special silent
    no_focus = true
}

layerrule = blur on, match:namespace logout_dialog
layerrule = dim_around on, match:namespace logout_dialog

# rofi の blur / dim_around 削除: 矩形 layer 全体に効いて丸い mainbox の角がぼやける副作用回避
