# Hyprland 内部のカーソル挙動 (env.conf の XCURSOR_SIZE / HYPRCURSOR_SIZE とは別物)
# テーマ自体は GTK/環境側で決定される。ここは Hyprland 固有の挙動のみ。
#
# 有効なキーは `hyprctl descriptions | grep '"cursor:'` で確認可

cursor {
    no_warps = false               # マウスを別モニタへワープさせない
    sync_gsettings_theme = false   # GTK設定との自動同期を切る (独立管理)
    enable_hyprcursor = true       # Hyprcursor テーマを優先 (フォールバックは XCursor)
}
