# bed-mode のモニター定義
# HDMI-A-1 (ベッド用 BenQ EX2510) のみ有効化、デスク 3 枚は無効。
# bed-mode.sh が monitors-active.conf 経由で本ファイルを source する。

monitor = HDMI-A-1, 1920x1080@144, 0x0, 1
monitor = DP-3,     disable
monitor = DP-2,     disable
monitor = DP-1,     disable

# bed-mode は 1 枚運用なので persistent は ws 1 だけ。
# desk-mode から継承された ws (2, 3, ...) があれば、monitor 割当ルールで HDMI-A-1
# にピン留めされる。空 ws は持ち越されないので waybar に余分な番号は出ない。
# Super+2..0 等で動的に作る分も全部 HDMI-A-1 に集約される。
workspace = 1, monitor:HDMI-A-1, default:true, persistent:true
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1
