input {
    kb_layout = us                 # キーボードレイアウト

    # キーリピート (Neovim など長押し移動を多用するため default より速く/短く)
    repeat_rate = 40               # 1秒あたりの連打数 (default=25)
    repeat_delay = 250             # 長押し→連打開始までの遅延ms (default=600)

    follow_mouse = 1               # マウス移動でフォーカス追従 (1=移動時, 2=常時, 0=クリックのみ)
    accel_profile = flat           # マウス加速無効化 (flat=1:1移動)
    sensitivity = 1.0              # マウス感度 (-1.0〜1.0, 0=変更なし)
    scroll_factor = 2              # スクロール量の倍率 (デフォルト=1)

    touchpad {
        natural_scroll = false     # ナチュラルスクロール (Mac風の逆方向スクロール)
    }
}

# タッチパッドジェスチャー: 3本指の水平スワイプでワークスペース切替
gesture = 3, horizontal, workspace
