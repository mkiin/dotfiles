# Wallust config
# 壁紙画像から 16 色 (Pywal 系) パレットを抽出。matugen の Material Design 3 トークンとは
# 別系統の色味が手に入る (鮮やかなアクセント色など、@color0..15 として CSS で参照)。

# 色抽出アルゴリズム。"wal" は Pywal 互換 (彩度高めの 16 色が出る)。
backend = "wal"

# 色空間 (lab = perceptual に近く、コントラスト出やすい)
color_space = "lab"

# 背景色との読みやすさを担保する (低コントラスト時に色を自動調整)
check_contrast = true

# 彩度ブースト 0 = しない (パレット本来の色を保持)
saturation = 0

[templates]
# waybar 用 CSS パレット (@color0..15 + @background, @foreground, @cursor)。
# noro-dotfiles の style プリセット群が前提とするトークンセット。
waybar = { template = "waybar.css", target = "~/.config/waybar/colors-waybar.css" }

# ghostty 用テーマ (palette = N=#hex, background, foreground, cursor-color)。
# `theme = wallust` で `~/.config/ghostty/themes/wallust` を読む仕組み。
ghostty = { template = "ghostty.conf", target = "~/.config/ghostty/themes/wallust" }

# wezterm 用カラースキーム (TOML)。wezterm.lua が load_scheme で読み reload watch する。
wezterm = { template = "wezterm.toml", target = "~/.config/wezterm/colors/wallust.toml" }
