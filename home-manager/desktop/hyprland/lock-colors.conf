$lock_colon         = rgba(e3c0a6ff)
$lock_minute        = rgba(e3c0a6ff)
$lock_ampm          = rgba(e3c0a6ff)
$lock_divider       = rgba(ffb77ccc)
$lock_month         = rgba(e3c0a6ff)
$lock_day           = rgba(ffb77cff)
$lock_weekday       = rgba(e3c0a6e6)
$lock_shadow        = rgba(11111baa)
$lock_input_outline = rgba(6c3a06d9)
$lock_input_bg      = rgba(19120cbf)
$lock_input_text    = rgba(efe0d6ff)
$lock_hint          = rgba(efe0d680)
$lock_success       = rgba(a6e3a1e6)
$lock_fail          = rgba(f38ba8e6)
