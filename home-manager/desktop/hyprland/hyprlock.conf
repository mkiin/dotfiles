source = ~/.config/hypr/lock-colors.conf

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = lockEase, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 5, lockEase
    animation = fadeOut, 1, 3, lockEase
    animation = inputFieldDots, 1, 3, default
    animation = inputFieldColors, 1, 4, default
    animation = inputFieldFade, 1, 4, default
}

background {
    monitor =
    path = ~/.config/hypr/lock.jpg
    blur_passes = 0
    brightness = 0.8
    contrast = 1.0
}

image {
    monitor =
    path = ~/.config/hypr/lock-scrim.png
    size = 800
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:10000] ~/.config/hypr/scripts/lock/lock-clock.sh time "$lock_hour" "$lock_colon" "$lock_minute" "$lock_ampm"
    font_size = 150
    font_family = Anton
    position = 70, 85
    halign = left
    valign = bottom
    shadow_passes = 3
    shadow_size = 4
    shadow_color = $lock_shadow
    shadow_boost = 1.2
}

label {
    monitor =
    text = cmd[update:10000] ~/.config/hypr/scripts/lock/lock-clock.sh date "$lock_date"
    font_size = 19
    font_family = Inter
    position = 74, 80
    halign = left
    valign = bottom
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $lock_shadow
    shadow_boost = 1.2
}

input-field {
    monitor =
    size = 300, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = $lock_input_outline
    inner_color = $lock_input_bg
    font_color = $lock_input_text
    fade_on_empty = true
    fade_timeout = 1000
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i>Enter password...</i>
    hide_input = false
    check_color = $lock_success
    fail_color = $lock_fail
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    rounding = -1
    position = 0, -80
    halign = center
    valign = center
}
