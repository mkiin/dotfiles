source = ~/.config/hypr/lock-colors.conf

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = lockEase, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 5, lockEase
    animation = fadeOut, 1, 4, lockEase
    animation = inputFieldDots, 1, 3, default
    animation = inputFieldColors, 1, 4, default
    animation = inputFieldFade, 1, 4, default
}

background {
    monitor =
    path = ~/.config/hypr/lock.jpg
    blur_passes = 0
    brightness = 0.8
    contrast = 1.0
}

# --- 左上クラスタ: 時刻・日付（写真上でも読めるよう text shadow） ---
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%H:%M")"
    color = $lock_clock
    font_size = 64
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 60, -60
    halign = left
    valign = top
    shadow_passes = 3
    shadow_size = 4
    shadow_color = $lock_shadow
    shadow_boost = 1.2
}

label {
    monitor =
    text = cmd[update:60000] echo "$(LC_ALL=C date +'%B %-d, %Y')"
    color = $lock_date
    font_size = 18
    font_family = JetBrainsMono Nerd Font Bold
    position = 62, -150
    halign = left
    valign = top
    shadow_passes = 3
    shadow_size = 3
    shadow_color = $lock_shadow
    shadow_boost = 1.2
}

# --- 中央クラスタ: 入力欄・ヒント ---
input-field {
    monitor =
    size = 300, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = $lock_input_outline
    inner_color = $lock_input_bg
    font_color = $lock_input_text
    fade_on_empty = true
    fade_timeout = 1000
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i>Enter password...</i>
    hide_input = false
    check_color = $lock_success
    fail_color = $lock_fail
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    rounding = -1
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = Type to unlock
    color = $lock_hint
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -75
    halign = center
    valign = center
}
