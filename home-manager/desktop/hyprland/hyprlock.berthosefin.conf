source = ~/.config/hypr/lock-colors.conf

$font = JetBrainsMono Nerd Font

general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    color = $lock_bg
}

# Time
label {
    monitor =
    text = $TIME
    color = $lock_text
    font_size = 24
    font_family = $font
    position = -10, 25
    halign = right
    valign = bottom
}

# Date
label {
    monitor =
    text = cmd[update:43200000] LC_ALL=C date +"%A, %d %B %Y"
    color = $lock_text
    font_size = 10
    font_family = $font
    position = -10, 10
    halign = right
    valign = bottom
}

# Avatar
image {
    monitor =
    path = $HOME/.face
    size = 150
    border_color = $lock_primary
    border_size = 3
    position = 0, 75
    halign = center
    valign = center
}

# Input field
input-field {
    monitor =
    size = 300, 35
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $lock_primary
    inner_color = $lock_surface
    font_color = $lock_input_text
    fade_on_empty = false
    placeholder_text = <span foreground="##$lock_on_surface_hex"><i>󰌾 Logged in as </i><span foreground="##$lock_primary_hex">$USER</span></span>
    hide_input = false
    check_color = $lock_primary
    fail_color = $lock_fail
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $lock_accent
    position = 0, -50
    halign = center
    valign = center
}
